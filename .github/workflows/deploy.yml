name: Build, Push, and Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: vocal-byte-509214-b1
  REGION: us-central1
  GAR_REPOSITORY: portfolio-app-repo
  SERVICE_NAME: portfolio-app-service
  IMAGE_NAME: app

jobs:
  build-and-deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Authenticate to GCP using Workload Identity Federation (OIDC)
      - name: Google Auth (Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/1032668331090/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-sa@vocal-byte-509214-b1.iam.gserviceaccount.com'

      # 2. Set up Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. Authenticate Docker with Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 4. Build and Push Docker Image with Git SHA tag
      - name: Build & Push Docker Image
        env:
          IMAGE_TAG: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |-
          docker build -t $IMAGE_TAG ./app
          docker push $IMAGE_TAG

      # 5. Deploy Container to Cloud Run with Probes and Port 8080
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated --port=8080 --startup-probe=httpGet.path=/health,httpGet.port=8080 --liveness-probe=httpGet.path=/health,httpGet.port=8080'
