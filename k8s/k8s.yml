apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-app-deployment
  labels:
    app: portfolio-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-app
  template:
    metadata:
      labels:
        app: portfolio-app
    spec:
      containers:
      - name: web-app
        # The image tag will be updated dynamically by your GitHub Actions workflow
        image: us-central1-docker.pkg.dev/vocal-byte-509214-b1/portfolio-app-repo/app:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-app-service
spec:
  type: LoadBalancer
  selector:
    app: portfolio-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
